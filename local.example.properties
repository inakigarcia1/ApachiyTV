# =============================================================================
# Apachiy TV — local.properties template
# =============================================================================
# Copy this file to `local.properties` (gitignored) and fill in your values.
# Default values in app/build.gradle.kts are empty so the build won't fail
# without these, but most features won't work until you set them.
#
# Restart Android Studio's Gradle sync after editing.
# =============================================================================

# -----------------------------------------------------------------------------
# Apachiy backend (REQUIRED for cloud sync, profiles, library, auth)
# -----------------------------------------------------------------------------
# Public Supabase URL of your self-hosted Apachiy Supabase instance.
# Should start with https://. NO trailing slash.
APACHIY_SUPABASE_URL=https://your-apachiy-supabase.example

# Public anon key from your Apachiy Supabase (Project Settings -> API -> anon public).
# This is JWT-shaped. It is safe to embed in the APK; do NOT use the service_role key.
APACHIY_SUPABASE_ANON_KEY=eyJhbGciOi...

# -----------------------------------------------------------------------------
# Apachiy REST API (for device registration /v1/devices/register)
# -----------------------------------------------------------------------------
# Base URL of your existing Apachiy .NET API (the same one that exposes
# /api/public/registrations and /v1/devices/register). NO trailing slash.
APACHIY_API_BASE_URL=https://your-apachiy-api.example

# -----------------------------------------------------------------------------
# TV login web URL
# -----------------------------------------------------------------------------
# Where the QR shown on the TV points to. The user opens this URL on a phone,
# signs in on the Apachiy landing, approves the TV, and the TV polls until
# approved then exchanges tokens. Point this at your landing /tv-login route.
# Local dev example: http://192.168.0.50:5173/tv-login  (NO trailing slash)
APACHIY_TV_LOGIN_WEB_BASE_URL=https://your-apachiy-landing.example/tv-login

# Optional legacy key (legacy Nuvio fork used NUVIO_* prefix). Empty by default.
# IMPORTANT: leave empty. Apachiy production MUST NOT silently fall back to
# the official Nuvio backend (api.nuvio.tv). If empty, the auth flow surfaces
# errors instead of swapping to a foreign server.
NUVIO_SUPABASE_FALLBACK_URL=

# -----------------------------------------------------------------------------
# Avatar public URL (optional)
# -----------------------------------------------------------------------------
# Override the default Supabase Storage public URL for the avatars bucket.
# Default is built as: ${APACHIY_SUPABASE_URL}/storage/v1/object/public/avatars
# Leave empty to use the default.
AVATAR_PUBLIC_BASE_URL=

# -----------------------------------------------------------------------------
# Third-party integrations (optional; empty disables the feature)
# -----------------------------------------------------------------------------
TMDB_API_KEY=
TRAKT_CLIENT_ID=
TRAKT_CLIENT_SECRET=
TRAKT_API_URL=https://api.trakt.tv/
TRAKT_REDIRECT_URI=urn:ietf:wg:oauth:2.0:oob
SIMKL_CLIENT_ID=
SIMKL_APP_NAME=apachiy
PREMIUMIZE_CLIENT_ID=
PARENTAL_GUIDE_API_URL=
INTRODB_API_URL=
TRAILER_API_URL=
IMDB_RATINGS_API_BASE_URL=
IMDB_TAPFRAME_API_BASE_URL=
DONATIONS_BASE_URL=
DONATIONS_DONATE_URL=
UNIQUE_CONTRIBUTIONS_BASE_URL=
# Playback reports URL. Leave empty to disable playback telemetry entirely.
PLAYBACK_REPORTS_BASE_URL=

# -----------------------------------------------------------------------------
# DV7 / libdovi (Dolby Vision Profile 7 -> 8.1)
# -----------------------------------------------------------------------------
DOVI_NATIVE_ENABLED=true
DOVI_EXTRACTOR_HOOK_READY=true
DOVI_ENABLE_REAL_LINK=true
DOVI_LIBDOVI_PREBUILT_ROOT=DV7/libdovi

# -----------------------------------------------------------------------------
# FFmpeg decoder (advanced; defaults work for most users)
# -----------------------------------------------------------------------------
USE_LOCAL_FFMPEG_DECODER=false
FFMPEG_SOURCE_DIR=
FFMPEG_BUILD_DIR=

# -----------------------------------------------------------------------------
# Sentry (telemetry)
# -----------------------------------------------------------------------------
# Leave SENTRY_DSN empty to disable Sentry entirely.
# When you provision your own Sentry project, set the DSN of that project here.
SENTRY_DSN=
SENTRY_AUTH_TOKEN=
SENTRY_ORG=
SENTRY_PROJECT=