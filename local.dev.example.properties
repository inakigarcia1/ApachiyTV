# =============================================================================
# Apachiy TV — local backend overlay (gitignored as local.dev.properties)
# =============================================================================
# Used only by:
#   .\scripts\run-tv-local.ps1
#
# Cloud values in local.properties stay untouched.
# Keep localhost here. The script rewrites it to 10.0.2.2 inside the emulator APK.
# The phone that scans the TV login QR cannot open 10.0.2.2, so that URL stays
# a LAN address.
# =============================================================================

APACHIY_SUPABASE_URL=http://localhost:8000
APACHIY_SUPABASE_ANON_KEY=
APACHIY_API_BASE_URL=http://localhost:10050
APACHIY_TV_LOGIN_WEB_BASE_URL=http://192.168.x.x:5173/tv-login
NUVIO_SUPABASE_FALLBACK_URL=
SENTRY_DSN=
