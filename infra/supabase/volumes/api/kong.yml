_format_version: "2.1"
_transform: true

services:
  - name: auth
    url: http://supabase-auth:9999/verify
    routes:
      - name: auth-all
        paths:
          - /auth/v1/
    plugins:
      - name: cors
  - name: rest
    url: http://supabase-rest:3000/
    routes:
      - name: rest-all
        paths:
          - /rest/v1/
    plugins:
      - name: cors
  - name: realtime
    url: http://supabase-realtime:4000/socket
    routes:
      - name: realtime-all
        paths:
          - /realtime/v1/
    plugins:
      - name: cors
  - name: storage
    url: http://supabase-storage:5000/
    routes:
      - name: storage-all
        paths:
          - /storage/v1/
    plugins:
      - name: cors
  - name: functions
    url: http://supabase-edge-functions:9000/
    paths:
      - /functions/v1/
    plugins:
      - name: cors
  - name: meta
    url: http://supabase-meta:5001/
    routes:
      - name: meta-all
        paths:
          - /pg/
    plugins:
      - name: cors
  - name: studio
    url: http://supabase-studio:3000/
    routes:
      - name: studio-all
        paths:
          - /
    plugins:
      - name: cors