_format_version: "2.1"
_transform: true

# Apachiy TV API gateway routes. Studio is published separately on :3001;
# do not mount Studio at "/" here or it captures /auth/v1 and /rest/v1.

services:
  - name: auth
    url: http://supabase-auth:9999/
    routes:
      - name: auth-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors

  - name: rest
    url: http://supabase-rest:3000/
    routes:
      - name: rest-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors

  - name: realtime
    url: http://realtime-dev.supabase-realtime:4000/socket
    routes:
      - name: realtime-all
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors

  - name: storage
    url: http://supabase-storage:5000/
    routes:
      - name: storage-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors

  - name: functions
    url: http://supabase-edge-functions:9000/
    routes:
      - name: functions-v1-all
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: cors
